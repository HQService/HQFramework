config-version: 2.3.0

lang: ko_kr

netty:
  enabled: false
  thread: 2
  host: 127.0.0.1
  port: 11286
  # 프록시와 백엔드가 공유하는 인증 비밀값. 양쪽에 같은 값을 넣어야 연결됩니다.
  secret: ""

log:
  error:
    store-limit: 1000
    store-path: "hq-errors/"
    print-stack-traces-when-unhandled: false

database:
  # h2, sqlite, mysql
  type: h2
  # 확장자는 붙이지 않아야합니다.
  file-path: "hq-database/database"

  mysql:
    host: localhost
    port: 3306
    user: root
    password: password
    database: hq

    maximum-pool-size: 10
    maximum-lifetime: 1800000
    keepalive-time: 0
    connection-timeout: 30000
    idle-timeout: 600000
    minimum-idle: -1

player-data:
  # 플레이어 데이터 소유권 조율 백엔드. database 또는 redis.
  # 네트워크의 모든 서버가 같은 값을 써야 합니다. 다르면 기동이 거부됩니다.
  # redis 를 쓰면 소유권 조율과 CachedPlayerRepository 의 최신 데이터는 Redis 에,
  # 영속 저장은 여전히 아래 database 설정의 MySQL/H2/SQLite 에 주기적으로 기록됩니다.
  backend: database
  # 소유권 유지 시간(초). renew-seconds 의 3배 이상을 권장합니다.
  lease-seconds: 30
  # 소유권 갱신 주기(초)
  renew-seconds: 10
  # 접속 시 이전 서버의 저장 완료를 기다리는 최대 시간(초). 넘으면 킥됩니다.
  join-timeout-seconds: 5
  # 소유권 재시도 간격(밀리초)
  retry-interval-millis: 200
  # update {} 로 바뀐 데이터를 DB 에 쓰는 주기(초)
  dirty-flush-seconds: 5
  # 모든 접속자의 데이터를 한 바퀴 저장하는 주기(초). 이 시간 동안 나눠서 저장합니다.
  full-flush-seconds: 60

redis:
  # 비워 두면 Redis 를 사용하지 않습니다. 예: redis://:password@127.0.0.1:6379/0
  # player-data.backend 가 redis 면 반드시 채워야 합니다. 채우면 backend 와 관계없이 CachedPlayerRepository 가 Redis 를 사용합니다.
  # Redis 를 쓸 때는 AOF(appendfsync everysec) 를 켜 두세요. Redis 가 유실되면 마지막 DB 저장 이후의 변경이 사라집니다.
  # Redis 에 접속할 수 없으면 플레이어 접속이 보류되고, 회복되지 않으면 킥됩니다. DB 로 자동 전환하지 않습니다.
  # Redis Cluster 는 지원하지 않습니다. Redis 5 이상이 필요합니다.
  uri: ""
  # 프레임워크 키 접두어. 플러그인은 자기 접두어를 쓰세요.
  key-prefix: hq
  # CachedPlayerRepository 가 MySQL 저장을 마친 플레이어 데이터를 Redis 에 남겨 두는 시간(초)
  data-ttl-seconds: 3600

scheduler:
  # Quartz 클러스터 인스턴스 ID. 비워두면 "호스트명:포트" 를 사용합니다.
  instance-id: ""

  thread-pool:
    thread-count: 10
    thread-priority: 5

  job-store:
    # cluster 환경일 경우, true 로 설정해주세요.
    # SQLite DataSource 일때는 클러스터 환경에서 동작될 수 없기 때문에, false 로 설정되어야 합니다.
    is-clustered: false
    # JobDataMaps 가 저장될 때 blob 으로 저장되지 않고, key-value 쌍으로 직렬화되어 저장됩니다.
    use-properties: true
    # https://stackoverflow.com/questions/1933676/quartz-java-resuming-a-job-executes-it-many-times
    misfire-threshold: 1100
    # https://stackoverflow.com/questions/14953297/recomended-value-for-org-quartz-jobstore-clustercheckininterval
    cluster-checkin-interval: 2000
command:
  tab-complete:
    limit-per-second: 20

forge-support: false